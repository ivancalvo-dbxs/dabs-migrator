name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v1.0"
          else
            major=$(echo "$latest" | sed 's/^v\([0-9]*\)\.0$/\1/')
            next="v$((major + 1)).0"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create zip archive
        run: zip -r dabs-migrator-${{ steps.version.outputs.tag }}.zip dabs-migrator/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dabs-migrator-${{ steps.version.outputs.tag }}.zip
